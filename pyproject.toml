[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotsync"
dynamic = ["version"]
description = "Bidirectional dotfiles sync with git, profiles, and templating"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ariel Shatil" }]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dotsync = "dotsync.__main__:cli"

[tool.setuptools.dynamic]
version = {attr = "dotsync.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["dotsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
