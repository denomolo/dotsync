[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncdot"
dynamic = ["version"]
description = "Bidirectional dotfiles sync with git, profiles, and templating"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ariel Shatil" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["dotfiles", "sync", "git", "jinja2", "config", "systemd"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/denomolo/syncdot"
Changelog = "https://github.com/denomolo/syncdot/blob/main/CHANGELOG.md"
Issues = "https://github.com/denomolo/syncdot/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=6"]

[project.scripts]
syncdot = "syncdot.__main__:cli"

[tool.setuptools.dynamic]
version = {attr = "syncdot.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["syncdot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
